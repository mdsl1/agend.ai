services:

  db:
    image: postgres:16-alpine
    container_name: agendai_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - db_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: agendai_api
    ports:
      - "5000:5000"
    volumes:
      - ./api:/app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - N8n__ApiKey=${N8N_API_KEY}
    depends_on:
      - db
    networks:
      - db_net
      - app_net

  app:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: agendai_app
    ports:
      - "5173:5173"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_PROXY_TARGET=http://api:5000
    networks:
      - app_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: agendai_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/data/workflows
    networks:
      - app_net

networks:
  db_net:
    driver: bridge
    internal: true
  app_net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
