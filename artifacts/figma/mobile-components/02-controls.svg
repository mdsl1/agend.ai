<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="470" viewBox="0 0 1360 470" role="img" aria-labelledby="title desc">
  <title id="title">Agend.AI Profissional — Mobile Components — Controls</title>
  <desc id="desc">Text fields, search, toggles, checkbox, radio and segmented controls for mobile forms.</desc>
  <defs>
    <style>
      .title{font:750 28px 'Hanken Grotesk',Inter,sans-serif;fill:#131B2E}.subtitle{font:500 13px Inter,sans-serif;fill:#515F74}
      .panel-title{font:700 17px 'Hanken Grotesk',Inter,sans-serif;fill:#131B2E}.label{font:700 11px Inter,sans-serif;fill:#3D494C}.body{font:500 13px Inter,sans-serif;fill:#3D494C}.body-strong{font:700 13px Inter,sans-serif;fill:#131B2E}.meta{font:500 10px Inter,sans-serif;fill:#6D797D}.small{font:650 10px Inter,sans-serif;fill:#515F74}.center{text-anchor:middle}
      .panel{fill:#FFFFFF;stroke:#E2E8F0}.field{fill:#FFFFFF;stroke:#BDC8CD;stroke-width:1.2}.line{stroke:#E2E8F0;stroke-width:1}
    </style>
  </defs>
  <rect width="1360" height="470" rx="24" fill="#F8FAFC" stroke="#DDE5E8"/>
  <g id="controls-header" data-name="Controls / Documentation">
    <text x="40" y="48" class="title">Controles e campos</text>
    <text x="40" y="73" class="subtitle">Formulários claros, feedback imediato e estados consistentes para toque e teclado.</text>
    <rect x="1178" y="28" width="142" height="40" rx="14" fill="#E6F5F8"/><text x="1249" y="53" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#006578">FORM INPUTS</text>
  </g>
  <g id="controls-panels" data-name="Controls / Panels">
    <rect x="40" y="98" width="780" height="338" rx="20" class="panel"/>
    <rect x="840" y="98" width="480" height="338" rx="20" class="panel"/>
    <text x="68" y="131" class="panel-title">Text Field</text><text x="68" y="150" class="meta">State: Default / Focused / Error / Disabled · helper opcional · ícone contextual</text>
    <text x="868" y="131" class="panel-title">Selection Controls</text><text x="868" y="150" class="meta">Toggle, checkbox, radio e segmented control</text>
  </g>

  <g id="text-field-default" data-name="Text Field / State=Default, Icon=False">
    <text x="68" y="184" class="label">E-mail</text>
    <rect x="68" y="194" width="344" height="54" rx="14" class="field"/>
    <text x="86" y="227" class="body">marina.souza@clinica.com</text>
  </g>
  <g id="text-field-focused" data-name="Text Field / State=Focused, Icon=True">
    <text x="440" y="184" class="label">Seu preço</text>
    <rect x="440" y="194" width="344" height="54" rx="14" fill="#FFFFFF" stroke="#0097B2" stroke-width="2"/>
    <text x="458" y="227" class="body-strong">R$</text><text x="494" y="227" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#131B2E">260,00</text>
    <rect x="494" y="232" width="47" height="2" rx="1" fill="#0097B2" opacity=".55"/>
  </g>
  <g id="text-field-error" data-name="Text Field / State=Error, Icon=True">
    <text x="68" y="288" class="label">Horário final</text>
    <rect x="68" y="298" width="344" height="54" rx="14" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.6"/>
    <circle cx="94" cy="325" r="10" fill="#FEE2E2"/><text x="94" y="329" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#B91C1C">!</text>
    <text x="116" y="330" class="body">11:00</text>
    <text x="68" y="371" font-family="Inter,sans-serif" font-size="10" font-weight="600" fill="#B91C1C">O horário final deve ser posterior ao inicial.</text>
  </g>
  <g id="text-field-disabled" data-name="Text Field / State=Disabled, Icon=True">
    <text x="440" y="288" class="label" fill="#7B898D">Procedimento</text>
    <rect x="440" y="298" width="344" height="54" rx="14" fill="#F1F5F9" stroke="#D6DEE2"/>
    <circle cx="466" cy="325" r="11" fill="#DDE5E8"/><path d="M461 325h10m-5-5v10" fill="none" stroke="#7B898D" stroke-width="1.5" stroke-linecap="round"/>
    <text x="490" y="330" font-family="Inter,sans-serif" font-size="13" font-weight="500" fill="#7B898D">Consulta dermatológica</text>
    <path d="M758 320l5 5-5 5" fill="none" stroke="#9BA8AC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="371" class="meta">Definido pelo catálogo da clínica</text>
  </g>
  <g id="search-field" data-name="Search Field / State=Default">
    <rect x="68" y="390" width="344" height="34" rx="12" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="88" cy="407" r="6" fill="none" stroke="#6D797D" stroke-width="1.5"/><path d="M92 411l5 5" fill="none" stroke="#6D797D" stroke-width="1.5" stroke-linecap="round"/>
    <text x="108" y="411" class="meta">Buscar procedimento</text>
  </g>

  <g id="toggle-off" data-name="Toggle / Value=Off, State=Default">
    <text x="868" y="191" class="body-strong">Lembretes da agenda</text>
    <rect x="1218" y="174" width="46" height="28" rx="14" fill="#CBD5E1"/><circle cx="1232" cy="188" r="10" fill="#FFFFFF"/>
  </g>
  <g id="toggle-on" data-name="Toggle / Value=On, State=Default">
    <text x="868" y="234" class="body-strong">Respostas de reagendamento</text>
    <rect x="1218" y="217" width="46" height="28" rx="14" fill="#0097B2"/><circle cx="1250" cy="231" r="10" fill="#FFFFFF"/>
  </g>
  <g id="toggle-disabled" data-name="Toggle / Value=On, State=Disabled">
    <text x="868" y="277" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#8A969A">Sincronização automática</text>
    <rect x="1218" y="260" width="46" height="28" rx="14" fill="#B9E5EC"/><circle cx="1250" cy="274" r="10" fill="#F8FAFC"/>
  </g>
  <path d="M868 300h424" class="line"/>

  <g id="checkbox-unchecked" data-name="Checkbox / Selected=False">
    <rect x="868" y="319" width="22" height="22" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="900" y="335" class="small">Repetir semanalmente</text>
  </g>
  <g id="checkbox-checked" data-name="Checkbox / Selected=True">
    <rect x="1040" y="319" width="22" height="22" rx="6" fill="#0097B2"/><path d="M1046 330l4 4 7-9" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="1072" y="335" class="small">Notificar paciente</text>
  </g>
  <g id="radio-unselected" data-name="Radio / Selected=False">
    <circle cx="879" cy="367" r="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/><text x="900" y="372" class="small">Opção A</text>
  </g>
  <g id="radio-selected" data-name="Radio / Selected=True">
    <circle cx="1019" cy="367" r="11" fill="#FFFFFF" stroke="#0097B2" stroke-width="1.8"/><circle cx="1019" cy="367" r="5" fill="#0097B2"/><text x="1040" y="372" class="small">Opção B</text>
  </g>

  <g id="segmented-control" data-name="Segmented Control / Items=3, Selected=Agenda">
    <rect x="868" y="390" width="396" height="36" rx="13" fill="#EDF2F4"/>
    <rect x="998" y="393" width="133" height="30" rx="10" fill="#FFFFFF" stroke="#DDE5E8"/>
    <text x="933" y="413" class="small center">Semana</text><text x="1064.5" y="413" font-family="Inter,sans-serif" font-size="10" font-weight="750" fill="#007D94" text-anchor="middle">Agenda</text><text x="1198" y="413" class="small center">Mês</text>
  </g>
</svg>
