<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="560" viewBox="0 0 1360 560" role="img" aria-labelledby="title desc">
  <title id="title">Agend.AI Profissional — Mobile Components — App Patterns</title>
  <desc id="desc">Navigation, appointment cards, metric cards and list rows used across the mobile application.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#12202D" flood-opacity=".08"/></filter>
    <style>
      .title{font:750 28px 'Hanken Grotesk',Inter,sans-serif;fill:#131B2E}.subtitle{font:500 13px Inter,sans-serif;fill:#515F74}.panel-title{font:700 17px 'Hanken Grotesk',Inter,sans-serif;fill:#131B2E}
      .h3{font:700 14px 'Hanken Grotesk',Inter,sans-serif;fill:#131B2E}.body{font:500 12px Inter,sans-serif;fill:#3D494C}.strong{font:700 12px Inter,sans-serif;fill:#131B2E}.meta{font:500 9px Inter,sans-serif;fill:#6D797D}.small{font:650 9px Inter,sans-serif;fill:#515F74}.tab{font:650 8px Inter,sans-serif;fill:#6D797D;text-anchor:middle}.tab-on{font:750 8px Inter,sans-serif;fill:#007D94;text-anchor:middle}
      .panel{fill:#FFFFFF;stroke:#E2E8F0}.card{fill:#FFFFFF;stroke:#E2E8F0}.line{stroke:#E2E8F0;stroke-width:1}.icon{stroke:#515F74;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.icon-on{stroke:#007D94;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1360" height="560" rx="24" fill="#F8FAFC" stroke="#DDE5E8"/>
  <g id="patterns-header" data-name="App Patterns / Documentation">
    <text x="40" y="48" class="title">Padrões do aplicativo</text>
    <text x="40" y="73" class="subtitle">Composições reutilizadas nas telas de agenda, receitas, procedimentos e perfil.</text>
    <rect x="1160" y="28" width="160" height="40" rx="14" fill="#E6F5F8"/><text x="1240" y="53" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#006578">APP PATTERNS</text>
  </g>
  <g id="patterns-panels" data-name="App Patterns / Panels">
    <rect x="40" y="98" width="420" height="426" rx="20" class="panel"/>
    <rect x="480" y="98" width="560" height="426" rx="20" class="panel"/>
    <rect x="1060" y="98" width="260" height="426" rx="20" class="panel"/>
    <text x="68" y="131" class="panel-title">Navigation</text><text x="508" y="131" class="panel-title">Appointment Card</text><text x="1088" y="131" class="panel-title">Data &amp; List</text>
  </g>

  <g id="top-app-bar-root" data-name="Top App Bar / Type=Root, Action=True">
    <rect x="64" y="153" width="372" height="64" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="84" y="192" font-family="Hanken Grotesk,Inter,sans-serif" font-size="20" font-weight="750" fill="#131B2E">Minha agenda</text>
    <rect x="376" y="163" width="44" height="44" rx="14" fill="#E6F5F8"/><path d="M390 185h16m-8-8v16" class="icon-on"/>
  </g>
  <g id="top-app-bar-back" data-name="Top App Bar / Type=Back, Action=True">
    <rect x="64" y="229" width="372" height="64" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="76" y="239" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/><path d="M102 248l-9 13 9 13m-8-13h12" class="icon"/>
    <text x="134" y="268" font-family="Hanken Grotesk,Inter,sans-serif" font-size="17" font-weight="750" fill="#131B2E">Detalhes</text>
    <circle cx="400" cy="261" r="20" fill="#FFFFFF" stroke="#E2E8F0"/><circle cx="393" cy="261" r="2" fill="#515F74"/><circle cx="400" cy="261" r="2" fill="#515F74"/><circle cx="407" cy="261" r="2" fill="#515F74"/>
  </g>
  <g id="date-navigator" data-name="Date Navigator / Range=Week">
    <rect x="64" y="305" width="372" height="48" rx="15" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="88" cy="329" r="14" fill="#E6F5F8"/><path d="M92 324l-5 5 5 5" class="icon-on"/>
    <text x="250" y="333" text-anchor="middle" class="strong">24 — 30 de agosto</text>
    <circle cx="412" cy="329" r="14" fill="#E6F5F8"/><path d="M408 324l5 5-5 5" class="icon-on"/>
  </g>
  <g id="bottom-navigation" data-name="Bottom Navigation / Active=Agenda">
    <rect x="64" y="368" width="372" height="104" rx="20" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
    <path d="M64 383h372" class="line"/>
    <g><path d="M88 413l9-7 9 7v11h-6v-7h-6v7h-6z" class="icon"/><text x="97" y="450" class="tab">Início</text></g>
    <g><rect x="158" y="406" width="18" height="18" rx="3" class="icon-on"/><path d="M158 413h18m-13-10v6m8-6v6" class="icon-on"/><text x="167" y="450" class="tab-on">Agenda</text></g>
    <g><path d="M230 424v-10m8 10v-18m8 18v-14" class="icon"/><text x="238" y="450" class="tab">Receitas</text></g>
    <g><rect x="300" y="407" width="18" height="17" rx="4" class="icon"/><path d="M304 415h10m-5-5v10" class="icon"/><text x="309" y="450" class="tab">Serviços</text></g>
    <g><circle cx="381" cy="412" r="6" class="icon"/><path d="M371 425c3-7 17-7 20 0" class="icon"/><text x="381" y="450" class="tab">Perfil</text></g>
  </g>

  <g id="appointment-confirmed" data-name="Appointment Card / Type=Patient, Status=Confirmed">
    <rect x="504" y="153" width="248" height="158" rx="18" class="card" filter="url(#shadow)"/>
    <rect x="504" y="153" width="5" height="158" rx="2.5" fill="#0097B2"/>
    <text x="524" y="179" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#006578">10:30 — 11:20</text>
    <rect x="661" y="165" width="73" height="22" rx="11" fill="#DCFCE7"/><circle cx="674" cy="176" r="3" fill="#16A34A"/><text x="684" y="180" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="#166534">Confirmado</text>
    <text x="524" y="211" class="h3">Ana Carolina Ribeiro</text><text x="524" y="232" class="body">Consulta dermatológica</text>
    <path d="M524 250h208" class="line"/><text x="524" y="273" class="meta">50 min</text><text x="732" y="273" text-anchor="end" class="strong">R$ 260,00</text>
    <circle cx="716" cy="291" r="13" fill="#E6F5F8"/><path d="M711 291h10m-4-4 4 4-4 4" class="icon-on"/>
  </g>
  <g id="appointment-pending" data-name="Appointment Card / Type=Patient, Status=Pending">
    <rect x="768" y="153" width="248" height="158" rx="18" class="card"/>
    <rect x="768" y="153" width="5" height="158" rx="2.5" fill="#F59E0B"/>
    <text x="788" y="179" font-family="Inter,sans-serif" font-size="10" font-weight="800" fill="#92400E">14:00 — 14:40</text>
    <rect x="933" y="165" width="65" height="22" rx="11" fill="#FEF3C7"/><circle cx="946" cy="176" r="3" fill="#F59E0B"/><text x="956" y="180" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="#92400E">Pendente</text>
    <text x="788" y="211" class="h3">Luiza Ferreira</text><text x="788" y="232" class="body">Procedimento</text>
    <path d="M788 250h208" class="line"/><text x="788" y="273" class="meta">40 min</text><text x="996" y="273" text-anchor="end" class="strong">R$ 320,00</text>
    <text x="788" y="298" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#D97706">Aguardando integração</text>
  </g>
  <g id="appointment-unavailable" data-name="Appointment Card / Type=Unavailable, Status=Blocked">
    <rect x="504" y="327" width="248" height="158" rx="18" fill="#F1F5F9" stroke="#CBD5E1" stroke-dasharray="5 4"/>
    <circle cx="532" cy="356" r="15" fill="#FFFFFF"/><path d="M525 356h14" class="icon"/>
    <text x="557" y="353" class="h3">Indisponível</text><text x="557" y="374" class="meta">12:00 — 13:30</text>
    <path d="M524 394h208" class="line"/><text x="524" y="418" class="body">Almoço</text><text x="524" y="439" class="meta">Evento do Google Calendar</text>
    <rect x="524" y="452" width="92" height="23" rx="11.5" fill="#FFFFFF"/><text x="570" y="468" text-anchor="middle" class="small">Editar bloqueio</text>
  </g>
  <g id="appointment-reschedule" data-name="Appointment Card / Type=Reschedule, Status=Accepted">
    <rect x="768" y="327" width="248" height="158" rx="18" fill="#E6F5F8" stroke="#B9E5EC"/>
    <circle cx="796" cy="356" r="15" fill="#FFFFFF"/><path d="M789 356l5 5 9-11" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="821" y="353" class="h3">Reagendamento aceito</text><text x="821" y="374" class="meta">Paulo Mendes</text>
    <path d="M788 394h208" stroke="#B9E5EC"/>
    <text x="788" y="417" class="meta">DE</text><text x="821" y="417" class="strong">Qui., 27 ago · 08:00</text>
    <text x="788" y="442" class="meta">PARA</text><text x="821" y="442" class="strong">Sex., 28 ago · 08:00</text>
    <text x="788" y="470" font-family="Inter,sans-serif" font-size="9" font-weight="700" fill="#007D94">Agenda sincronizada</text>
  </g>

  <g id="metric-revenue" data-name="Metric Card / Type=Revenue, Tone=Brand">
    <rect x="1084" y="153" width="212" height="92" rx="17" fill="#007D94"/>
    <text x="1102" y="178" font-family="Inter,sans-serif" font-size="9" font-weight="650" fill="#C9F1F7">Receita estimada</text><text x="1102" y="211" font-family="Hanken Grotesk,Inter,sans-serif" font-size="23" font-weight="760" fill="#FFFFFF">R$ 12.480</text>
    <rect x="1102" y="220" width="61" height="17" rx="8.5" fill="#FFFFFF" opacity=".15"/><text x="1132.5" y="232" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="#FFFFFF">+8,4%</text>
  </g>
  <g id="metric-count" data-name="Metric Card / Type=Count, Tone=Neutral">
    <rect x="1084" y="257" width="101" height="84" rx="16" class="card"/><circle cx="1105" cy="281" r="12" fill="#E6F5F8"/><rect x="1100" y="276" width="10" height="11" rx="2" fill="none" stroke="#007D94" stroke-width="1.4"/><text x="1124" y="282" class="meta">Hoje</text><text x="1101" y="324" font-family="Hanken Grotesk,Inter,sans-serif" font-size="24" font-weight="750" fill="#131B2E">6</text>
  </g>
  <g id="metric-pending" data-name="Metric Card / Type=Pending, Tone=Warning">
    <rect x="1195" y="257" width="101" height="84" rx="16" class="card"/><circle cx="1216" cy="281" r="12" fill="#FEF3C7"/><path d="M1216 274v8l5 3" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/><text x="1235" y="282" class="meta">Pend.</text><text x="1212" y="324" font-family="Hanken Grotesk,Inter,sans-serif" font-size="24" font-weight="750" fill="#131B2E">2</text>
  </g>
  <g id="list-row-settings" data-name="List Row / Type=Settings, Accessory=Chevron">
    <rect x="1084" y="357" width="212" height="66" rx="15" class="card"/>
    <circle cx="1108" cy="390" r="14" fill="#E6F5F8"/><path d="M1101 390h14m-7-7v14" class="icon-on"/>
    <text x="1132" y="385" class="strong">Privacidade</text><text x="1132" y="403" class="meta">Segurança da conta</text><path d="M1271 384l6 6-6 6" class="icon"/>
  </g>
  <g id="list-row-integration" data-name="List Row / Type=Integration, Accessory=Status">
    <rect x="1084" y="435" width="212" height="66" rx="15" class="card"/>
    <circle cx="1108" cy="468" r="14" fill="#DAE2FD"/><path d="M1101 468l14-7-5 16-4-5z" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="1132" y="463" class="strong">Telegram</text><text x="1132" y="481" class="meta">Mensagens conectadas</text><rect x="1249" y="456" width="34" height="20" rx="10" fill="#DCFCE7"/><text x="1266" y="470" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" font-weight="700" fill="#166534">Ativo</text>
  </g>
</svg>
